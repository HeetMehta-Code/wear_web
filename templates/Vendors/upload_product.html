{% extends "Vendors/base.html" %}

{% block content %}
<style>
    /* 1. Wrapper and Card */
    .upload-box { 
        display: flex; 
        justify-content: center; 
        padding: 40px 20px; 
        background: #142c1e; 
        min-height: 80vh; 
    }
    .card { 
        background: #000; 
        border: 3px solid #78b388; 
        border-radius: 24px; 
        width: 100%; 
        max-width: 950px; 
        padding: 40px; 
        box-shadow: 0 0px 50px #cfffdc; 
    }
    
    /* 2. Scoped Typography */
    .card h2 { color: #cfffdc; margin-top: 0; font-size: 24px; letter-spacing: 1px; }
    .card h3 { color: #78b388; font-size: 16px; margin-bottom: 15px; }
    .card label { 
        display: block; 
        color: #cfffdc; 
        font-size: 15px; 
        font-weight: 800; 
        text-transform: uppercase; 
        margin-bottom: 8px; 
        margin-top: 15px; 
    }
    
    /* 3. SCOPED INPUTS - Uniform Sizing */
    .card input[type="text"], 
    .card input[type="number"], 
    .card input[type="file"],
    .card select, 
    .card textarea { 
        width: 100%; 
        background: #111; 
        border: 1px solid #222; 
        padding: 12px; 
        color: #fff; 
        border-radius: 12px; 
        transition: 0.3s; 
        box-sizing: border-box; 
        outline: none;
        font-family: inherit;
        font-size: 13px;
        height: 45px; 
    }

    .card input[type="file"] {
        padding: 8px 12px;
        cursor: pointer;
    }

    .card textarea { height: auto; }

    .card input:focus, 
    .card select:focus, 
    .card textarea:focus { 
        border-color: #78b388; 
        background: #161616; 
        box-shadow: 0 0 10px rgba(120, 179, 136, 0.1);
    }

    /* 4. Variant Section - 4 Equal Columns */
    .variant-row { 
        display: grid; 
        grid-template-columns: 1fr 1fr 1fr 1fr 45px; 
        gap: 12px; 
        background: #0a0a0a; 
        padding: 15px; 
        border-radius: 15px; 
        margin-bottom: 10px; 
        border: 1px solid #1a1a1a;
        align-items: center;
    }
    
    .add-variant-btn { 
        background: transparent; 
        color: #78b388; 
        border: 2px dashed #333; 
        padding: 12px; 
        width: 100%; 
        border-radius: 12px; 
        cursor: pointer; 
        font-weight: 700; 
        transition: 0.3s; 
        margin-bottom: 25px;
    }
    .add-variant-btn:hover { border-color: #78b388; background: #0a110c; color: #cfffdc; }
    
    .remove-btn { 
        background: #221111; 
        color: #ff5555; 
        border: 1px solid #442222; 
        border-radius: 10px; 
        cursor: pointer; 
        font-weight: 900;
        transition: 0.2s;
        height: 45px;
        width: 100%;
    }
    .remove-btn:hover { background: #441111; }

    /* Color block styles */
    .color-block {
        background: #0a0a0a;
        border: 1px solid #222;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
    }
    .color-block-header {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 16px;
    }
    .color-header-fields {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 16px;
        flex: 1;
        align-items: end;
    }
    .size-rows-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
    }
    .size-row {
        display: grid;
        grid-template-columns: 1fr 1fr 45px;
        gap: 12px;
        align-items: center;
    }
    .add-size-btn {
        background: transparent;
        color: #78b388;
        border: 1px dashed #333;
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        transition: 0.2s;
        width: fit-content;
    }
    .add-size-btn:hover { border-color: #78b388; color: #cfffdc; }
    .size-section-wrap {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .color-stock-wrap {
        display: none;
        margin-top: 12px;
    }
    .color-stock-wrap.active {
        display: block;
    }
    .multi-image-preview {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
    }
    .multi-image-preview img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #78b388;
    }
    .variant-mode-note {
        margin-top: 8px;
        font-size: 11px;
        color: rgba(207,255,220,0.65);
    }
    .color-picker-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
    }
    .color-picker-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid #78b388;
        cursor: pointer;
        padding: 0;
        background: transparent;
    }
    .color-picker-input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
    }
    .color-code-label {
        color: #78b388;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* 6. Submit Button */
    .btn-publish { 
        width: 100%; 
        background: #cfffdc; 
        color: #000; 
        padding: 18px; 
        border: none; 
        border-radius: 15px; 
        font-weight: 900; 
        cursor: pointer; 
        font-size: 16px; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        margin-top: 20px;
        transition: 0.3s;
    }
    .btn-publish:hover { 
        background: #cfffdc; 
        transform: translateY(-2px); 
        box-shadow: 0 5px 20px rgba(207, 255, 220, 0.4); 
    }
</style>

<div class="upload-box">
    <div class="card">
        <h2>Upload New Product</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label>Product Name</label>
                    <input type="text" name="name" required placeholder="e.g. Premium Cotton T-Shirt">
                </div>
                <div>
                    <label>Brand Name</label>
                    <input type="text" name="brand" placeholder="e.g. Ramya Originals">
                </div>
            </div>

            <label>Description</label>
            <textarea name="description" rows="3" placeholder="Describe your product..."></textarea>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label>Category</label>
                    <select name="category" id="id_category" required onchange="updateSubCategories()">
                        <option value="mens">Men's Wear</option>
                        <option value="womens">Women's Wear</option>
                        <option value="kids">Kid's Wear</option>
                        <option value="bags">Bags</option>
                        <option value="footwear">Footwear</option>
                        <option value="makeup">Makeup</option>
                        <option value="sunglasses">Sunglasses</option>
                        <option value="belts">Belts</option>
                        <option value="purses">Purses</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label>Sub-Category</label>
                    <select name="sub_category" id="id_sub_category">
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label>Selling Price (₹)</label>
                    <input type="number" step="0.01" name="price" required placeholder="0.00">
                </div>
                <div>
                    <label>Original Price (₹)</label>
                    <input type="number" step="0.01" name="original_price" placeholder="For discount display">
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #222; margin: 30px 0;">

            <h3 style="color: #78b388;">Product Variants</h3>
            <p style="color: #666; font-size: 12px; margin-bottom: 20px;">
                Add one colour at a time. You can upload <strong style="color:#cfffdc;">multiple optional images per colour</strong>.
                Bags, purses, sunglasses and makeup use colour + stock only, without sizes.
            </p>

            <div id="color-container"></div>

            <button type="button" class="add-variant-btn" onclick="addColorBlock()">+ Add Colour</button>

            <button type="submit" class="btn-publish">Publish Product</button>
        </form>
    </div>
</div>

<script>
    const subData = {
        'mens': ['jackets', 'tshirts', 'shirts', 'hoodies', 'menpants', 'traditional'],
        'womens': ['saree', 'kurti', 'womenpants', 'womentshirts', 'western', 'sweatshirts'],
        'kids': ['boys', 'girls'],
    };
    const noSizeCategories = new Set(['makeup', 'sunglasses', 'bags', 'purses']);

    function isSizeOptionalCategory() {
        return noSizeCategories.has(document.getElementById('id_category').value);
    }

    function updateSubCategories() {
        const cat = document.getElementById('id_category').value;
        const subSelect = document.getElementById('id_sub_category');
        subSelect.innerHTML = '';
        const options = subData[cat] || ['Other'];
        options.forEach(opt => {
            const el = document.createElement('option');
            el.value = opt.toLowerCase();
            el.textContent = opt;
            subSelect.appendChild(el);
        });
        syncVariantMode();
    }

    function syncVariantMode() {
        const sizeOptional = isSizeOptionalCategory();
        document.querySelectorAll('.color-block').forEach(block => {
            const sizeSection = block.querySelector('.size-section-wrap');
            const addSizeBtn = block.querySelector('.add-size-btn');
            const colorStockWrap = block.querySelector('.color-stock-wrap');
            const sizeInputs = block.querySelectorAll('input[name="variant_size[]"]');

            if (sizeSection) sizeSection.style.display = sizeOptional ? 'none' : 'flex';
            if (addSizeBtn) addSizeBtn.style.display = sizeOptional ? 'none' : 'inline-flex';
            if (colorStockWrap) colorStockWrap.classList.toggle('active', sizeOptional);

            sizeInputs.forEach(input => {
                input.required = !sizeOptional;
                if (sizeOptional) input.value = '';
            });
        });
    }

    function addColorBlock() {
        const container = document.getElementById('color-container');
        const colorId = Date.now();
        const block = document.createElement('div');
        block.className = 'color-block';
        block.id = 'color-' + colorId;
        block.innerHTML = `
            <div class="color-block-header">
                <div class="color-header-fields">
                    <div>
                        <label style="color:#cfffdc;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;">Colour Name</label>
                        <input type="hidden" name="variant_color_group[]" value="${colorId}">
                        <input type="text" name="variant_color_name[]" placeholder="e.g. Red, Navy Blue" class="color-name-input" required>
                    </div>
                    <div>
                        <label style="color:#cfffdc;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;">Custom Colour</label>
                        <input type="color" name="variant_color_code[]" value="#333333" id="picker-${colorId}" class="color-picker-input" onchange="updateColorPreview(this)">
                    </div>
                    <div>
                        <label style="color:#cfffdc;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;">Colour Images</label>
                        <input type="file" name="variant_image_${colorId}[]" accept="image/*" multiple onchange="previewColorImages(this)">
                        <div class="variant-mode-note">Optional. The first selected image becomes the main colour image.</div>
                    </div>
                    <div class="color-picker-wrap">
                        <label class="color-picker-btn" for="picker-${colorId}" id="dot-${colorId}" style="background:#333333;"></label>
                        <span class="color-code-label" id="code-${colorId}">#333333</span>
                        <div id="imgPreview-${colorId}" class="multi-image-preview"></div>
                    </div>
                </div>
                <button type="button" class="remove-btn" style="width:45px;height:45px;margin-top:20px;flex-shrink:0;" onclick="document.getElementById('color-${colorId}').remove()">×</button>
            </div>

            <div class="size-section-wrap">
                <div class="size-rows-container" id="sizes-${colorId}">
                    <div class="size-row">
                        <input type="hidden" name="variant_group[]" value="${colorId}">
                        <input type="text" name="variant_size[]" placeholder="Size (e.g. S, M, XL, 42)" required>
                        <input type="number" name="variant_qty[]" placeholder="Stock qty" min="0" required>
                        <button type="button" class="remove-btn" style="width:45px;height:45px;" onclick="this.parentElement.remove()">×</button>
                    </div>
                </div>
                <button type="button" class="add-size-btn" onclick="addSizeRow('sizes-${colorId}', '${colorId}')">+ Add Size</button>
            </div>

            <div class="color-stock-wrap">
                <label style="color:#cfffdc;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;">Colour Stock</label>
                <input type="number" name="variant_color_qty[]" placeholder="Stock qty for this colour" min="0" value="0">
            </div>
        `;
        container.appendChild(block);
        updateColorPreview(block.querySelector('.color-picker-input'));
        syncVariantMode();
    }

    function addSizeRow(containerId, colorId) {
        const container = document.getElementById(containerId);
        const row = document.createElement('div');
        row.className = 'size-row';
        row.innerHTML = `
            <input type="hidden" name="variant_group[]" value="${colorId}">
            <input type="text" name="variant_size[]" placeholder="Size (e.g. S, M, XL, 42)" required>
            <input type="number" name="variant_qty[]" placeholder="Stock qty" min="0" required>
            <button type="button" class="remove-btn" style="width:45px;height:45px;" onclick="this.parentElement.remove()">×</button>
        `;
        container.appendChild(row);
        syncVariantMode();
    }

    function updateColorPreview(input) {
        const block = input.closest('.color-block');
        const colorId = block.id.replace('color-', '');
        const dot = document.getElementById('dot-' + colorId);
        const codeLabel = document.getElementById('code-' + colorId);
        const colorInput = block.querySelector('.color-picker-input');
        const colorValue = colorInput ? colorInput.value : '#333333';

        if (dot) {
            dot.style.backgroundColor = colorValue;
            dot.style.boxShadow = `0 0 12px ${colorValue}`;
        }
        if (codeLabel) {
            codeLabel.textContent = colorValue.toUpperCase();
        }
    }

    function previewColorImages(input) {
        const block = input.closest('.color-block');
        const colorId = block.id.replace('color-', '');
        const preview = document.getElementById('imgPreview-' + colorId);
        if (!preview) return;

        preview.innerHTML = '';
        if (input.files && input.files.length) {
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.alt = 'Preview';
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }
    }

    addColorBlock();
    updateSubCategories();
</script>
{% endblock %}
